<!DOCTYPE html>
<!-- 
 * CalmDash 생산성 허브 - 메인 화면 구조 (HTML)
 * 
 * 이 파일은 웹사이트의 뼈대를 담당합니다. 상단 바(Header), 메인 화면(Main), 팝업창(Modal) 등으로 구성되어 있습니다.
-->
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalmDash - Always visible, never intrusive</title>

    <!-- Tailwind CSS -->
    <!--
        보안 참고: Tailwind Play CDN은 SRI(Subresource Integrity)를 지원하지 않습니다.
        프로덕션 환경에서는 npm으로 설치한 빌드 버전 사용을 권장합니다.
    -->
    <script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        ink: {
                            black: '#000000',
                            dark: '#1a1a1a',
                            gray: '#888888',
                            light: '#e5e5e5',
                            white: '#ffffff',
                            paper: '#f5f5f5'
                        }
                    }
                }
            }
        }
    </script>


    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght[100..900]&display=swap"
        rel="stylesheet"
        crossorigin="anonymous">

    <!-- Phosphor Icons -->
    <!--
        보안 참고: 버전을 명시하여 예기치 않은 변경을 방지합니다.
        SRI 해시 추가를 위해서는 다음 명령으로 해시를 생성하세요:
        curl https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" crossorigin="anonymous"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen flex flex-col font-sans bg-paper text-ink-black">

    <!-- 상단 바: 서비스 이름, 현재 시각, 날씨 및 관리 버튼들이 들어가는 곳입니다. -->
    <header class="bg-white border-b-4 border-black p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center gap-1 md:gap-3">
            <h1 class="text-2xl font-black tracking-tight text-black">CalmDash</h1>
            <div class="flex items-center gap-2 text-[10px] sm:text-xs md:text-sm font-bold text-gray-600">
                <div id="live-date">YYYY년 MM월 DD일</div>
                <span class="opacity-30">|</span>
                <div id="live-clock">00:00</div>
                <span class="opacity-30">|</span>
                <div id="live-weather" class="flex items-center gap-2">
                    <!-- 자바스크립트가 실행되면서 여기에 실시간 날씨 정보를 넣어줄 거에요. -->
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="settings-btn"
                class="p-2 border-2 border-black hover:bg-black hover:text-white transition-colors" title="설정">
                <i class="ph ph-gear"></i>
            </button>
            <button id="theme-toggle"
                class="p-2 border-2 border-black hover:bg-black hover:text-white transition-colors" title="흑백 테마 전환">
                <i id="theme-icon" class="ph ph-sun"></i>
            </button>
        </div>
    </header>

    <!-- 메인 대시보드: 루틴, 할 일, 일정 카드가 보여지는 핵심 공간입니다. -->
    <main id="main-dashboard" class="flex-grow p-3 sm:p-6 max-w-7xl mx-auto w-full">
        <!-- 대시보드 그리드: sm(640px) 이상부터는 3단으로 표시하도록 변경합니다. -->
        <div id="dashboard-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-6">

            <!-- 각 섹션 컨테이너에 고유 ID를 부여하여 순서 조절을 가능하게 합니다. -->
            <!-- 1. 루틴 섹션 -->
            <div id="section-routines" class="flex flex-col gap-4">
                <div class="flex justify-between items-end border-b-2 border-black pb-2 mb-2">
                    <h3 class="text-xl font-black uppercase flex items-center gap-2">
                        <i class="ph ph-arrows-clockwise"></i> 루틴
                    </h3>
                    <div class="flex items-center gap-2">
                        <button id="toggle-routine-filter"
                            class="text-[10px] font-bold border-2 border-black px-2 py-0.5 hover:bg-black hover:text-white transition-colors">오늘만
                            보기</button>
                        <span id="routine-progress"
                            class="font-mono text-sm font-bold bg-black text-white px-2">0/0</span>
                    </div>
                </div>
                <div id="routine-list" class="flex flex-col gap-3">
                    <!-- 여기에 루틴들이 하나씩 나타납니다. -->
                </div>
                <div class="mt-auto pt-4">
                    <button class="w-full e-btn border-dashed text-gray-600 hover:text-black hover:border-solid"
                        data-action="add-routine">
                        + 새 루틴 추가
                    </button>
                </div>
            </div>

            <!-- 2. 할 일 섹션 -->
            <div id="section-todos" class="flex flex-col gap-4">
                <div class="flex justify-between items-end border-b-2 border-black pb-2 mb-2">
                    <h3 class="text-xl font-black uppercase flex items-center gap-2">
                        <i class="ph ph-check-square"></i> 할 일
                    </h3>
                    <div class="flex gap-1">
                        <button class="text-xs font-bold hover:underline cursor-pointer"
                            data-action="sort-priority">우선순위순</button>
                        <span class="text-xs">|</span>
                        <button class="text-xs font-bold hover:underline cursor-pointer"
                            data-action="sort-date">마감일순</button>
                    </div>
                </div>
                <div id="todo-list" class="flex flex-col gap-3 h-full">
                    <!-- 여기에 해야 할 일들이 하나씩 나타납니다. -->
                </div>
                <div class="mt-auto pt-4">
                    <button class="w-full e-btn border-dashed text-gray-600 hover:text-black hover:border-solid"
                        data-action="add-todo">
                        + 새 할 일 추가
                    </button>
                </div>
            </div>

            <!-- 3. 일정 섹션 -->
            <div id="section-schedules" class="flex flex-col gap-4">
                <div class="flex justify-between items-end border-b-2 border-black pb-2 mb-2">
                    <h3 class="text-xl font-black uppercase flex items-center gap-2">
                        <i class="ph ph-calendar"></i> 일정
                    </h3>
                    <button id="toggle-schedule-filter"
                        class="text-[10px] font-bold border-2 border-black px-2 py-1 hover:bg-black hover:text-white transition-colors">오늘
                        & 내일</button>
                </div>
                <div id="schedule-list" class="flex flex-col gap-3">
                    <!-- 여기에 일정들이 하나씩 나타납니다. -->
                </div>
                <div class="mt-auto pt-4">
                    <button class="w-full e-btn border-dashed text-gray-600 hover:text-black hover:border-solid"
                        data-action="add-schedule">
                        + 새 이벤트 추가
                    </button>
                </div>
            </div>


        </div>
    </main>

    <!-- 팝업창(모달) 공간: 정보를 입력하거나 수정할 때 나타나는 검정 배경의 창입니다. -->
    <div id="modal-overlay"
        class="hidden fixed inset-0 flex items-center justify-center z-50 bg-black/70 transition-opacity duration-300">
        <!-- 실행 시 여기에 팝업 창 내용이 생깁니다. -->
    </div>


    <!-- Footer -->
    <footer class="p-4 bg-white border-t-2 border-black text-center text-xs text-gray-500">
        <p>본 서비스는 <span class="font-bold underline cursor-pointer" id="storage-info-trigger">브라우저 스토리지</span>에 데이터를
            저장합니다.</p>
        <p class="mt-1">캐시 삭제 시 저장된 데이터가 소실될 수 있습니다.</p>
    </footer>

    <!-- Modules -->
    <script src="js/bundle.js"></script>
</body>

</html>
